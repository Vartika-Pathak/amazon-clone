envVarGroups:
  - name: amazon-clone-api-env
    envVars:
      - key: JAVA_VERSION
        value: "17"
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: MAIL_HOST
        value: smtp-relay.brevo.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
  - name: amazon-clone-web-env
    envVars:
      - key: VITE_API_URL
        sync: false

services:
  - type: web
    name: amazon-clone-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - fromGroup: amazon-clone-api-env

  - type: web
    name: amazon-clone-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - fromGroup: amazon-clone-web-env