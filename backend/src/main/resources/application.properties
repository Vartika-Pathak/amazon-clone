spring.application.name=amazon-clone

# SQLite file-based DB - simple, zero-setup, good for a deployed demo
spring.datasource.url=jdbc:sqlite:amazonclone.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

server.port=${PORT:8080}

jwt.secret=${JWT_SECRET:change-this-to-a-long-random-secret-in-production-please}
jwt.expiration-ms=86400000

spring.servlet.multipart.max-file-size=5MB

# Import a manageable catalog slice from backend/data/raw when present.
amazon.catalog-import.limit=500
amazon.catalog-import.path=data/raw/amazon_products_sales_data_cleaned.csv

stripe.secret-key=${STRIPE_SECRET_KEY:}
frontend.url=${FRONTEND_URL:http://localhost:5173}
